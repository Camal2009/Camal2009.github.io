<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle with tech border -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="8 6"/>
  
  <!-- Outer subtle tech rings -->
  <circle cx="200" cy="200" r="140" fill="#1e293b" fill-opacity="0.6"/>
  <circle cx="200" cy="200" r="120" fill="url(#bgGrad)"/>

  <!-- Developer Silhouette / Stylized Portrait -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <circle cx="200" cy="155" r="50" fill="url(#avatarGrad)"/>
    <!-- Modern tech glasses/visor -->
    <path d="M170 148 H230 C234 148 236 152 234 156 L226 166 C224 168 220 170 216 170 H184 C180 170 176 168 174 166 L166 156 C164 152 166 148 170 148 Z" fill="#e0f2fe" opacity="0.95"/>
    <line x1="164" y1="154" x2="152" y2="150" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="236" y1="154" x2="248" y2="150" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Torso / Hoodie -->
    <path d="M110 300 C110 240 150 225 200 225 C250 225 290 240 290 300 Z" fill="url(#avatarGrad)"/>
    <!-- Collar accent -->
    <path d="M175 225 L200 255 L225 225 Z" fill="#1e293b"/>
  </g>

  <!-- Status / Level badge -->
  <g transform="translate(140, 315)">
    <rect width="120" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="20" cy="16" r="6" fill="#22c55e"/>
    <text x="35" y="21" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">STUDENT</text>
  </g>
</svg>

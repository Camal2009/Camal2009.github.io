<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="robBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#31102f"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#robBg)"/>

  <!-- Radar circle / Sensor grid -->
  <circle cx="300" cy="160" r="130" fill="none" stroke="#4c1d3d" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="300" cy="160" r="90" fill="none" stroke="#881337" stroke-width="1.5"/>
  <circle cx="300" cy="160" r="50" fill="none" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="300" y1="30" x2="300" y2="290" stroke="#4c1d3d" stroke-width="1"/>
  <line x1="170" y1="160" x2="430" y2="160" stroke="#4c1d3d" stroke-width="1"/>

  <!-- Robotics Microcontroller / Hardware PCB mock -->
  <rect x="230" y="100" width="140" height="120" rx="10" fill="#1e1b4b" stroke="#f43f5e" stroke-width="2.5"/>
  
  <!-- Microcontroller chip -->
  <rect x="265" y="130" width="70" height="60" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="278" y="165" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="700">MCU-32</text>
  
  <!-- Chip pins -->
  <g fill="#f59e0b">
    <rect x="257" y="138" width="8" height="3"/>
    <rect x="257" y="148" width="8" height="3"/>
    <rect x="257" y="158" width="8" height="3"/>
    <rect x="257" y="168" width="8" height="3"/>
    <rect x="335" y="138" width="8" height="3"/>
    <rect x="335" y="148" width="8" height="3"/>
    <rect x="335" y="158" width="8" height="3"/>
    <rect x="335" y="168" width="8" height="3"/>
  </g>

  <!-- Sensor nodes / connection traces -->
  <path d="M230 140 L160 110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="160" cy="110" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="151" y="114" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700">IR</text>

  <path d="M370 140 L440 110" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <circle cx="440" cy="110" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="427" y="114" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="700">SONAR</text>

  <!-- Rover / Motor Wheels -->
  <rect x="180" y="240" width="70" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <rect x="350" y="240" width="70" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <path d="M250 255 L350 255" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Telemetry / Signal readout -->
  <g transform="translate(60, 290)">
    <rect width="180" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#22c55e"/>
    <text x="30" y="18" fill="#e2e8f0" font-family="monospace" font-size="10">Telemetry: 100% OK</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(420, 292)">
    <rect width="120" height="24" rx="12" fill="#f43f5e"/>
    <text x="15" y="16" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">PROJECT 3</text>
  </g>
</svg>

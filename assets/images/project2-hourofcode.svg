<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="hocBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#hocBg)"/>

  <!-- Code bracket graphics / Circuit hints -->
  <g stroke="#134e4a" stroke-width="1.5" opacity="0.4">
    <path d="M40 80 L80 180 L40 280" fill="none"/>
    <path d="M560 80 L520 180 L560 280" fill="none"/>
  </g>

  <!-- Large Hour of Code Badge / Clock icon -->
  <g transform="translate(190, 45)">
    <circle cx="110" cy="110" r="95" fill="#134e4a" fill-opacity="0.3" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="110" cy="110" r="80" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    
    <!-- Code bracket clock hands -->
    <path d="M90 95 L75 110 L90 125" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M130 95 L145 110 L130 125" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="110" y1="90" x2="110" y2="110" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="110" y1="110" x2="130" y2="110" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="110" cy="110" r="6" fill="#f59e0b"/>
    
    <!-- Code blocks below -->
    <text x="110" y="150" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="14" letter-spacing="2">HOUR OF CODE</text>
  </g>

  <!-- Visual Cards: Mentoring & Block Programming -->
  <g transform="translate(70, 240)">
    <!-- Block 1 -->
    <rect width="130" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="20" cy="21" r="7" fill="#38bdf8"/>
    <text x="35" y="26" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">when_start()</text>

    <!-- Block 2 -->
    <g transform="translate(150, 0)">
      <rect width="140" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <circle cx="20" cy="21" r="7" fill="#10b981"/>
      <text x="35" y="26" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">move_forward(5)</text>
    </g>

    <!-- Block 3 -->
    <g transform="translate(310, 0)">
      <rect width="150" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="20" cy="21" r="7" fill="#f59e0b"/>
      <text x="35" y="26" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700">teach_students()</text>
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(420, 298)">
    <rect width="120" height="24" rx="12" fill="#10b981"/>
    <text x="15" y="16" fill="#042f2e" font-family="system-ui, sans-serif" font-size="11" font-weight="800">PROJECT 2</text>
  </g>
</svg>

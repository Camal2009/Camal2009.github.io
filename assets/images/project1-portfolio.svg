  <rect x="220" y="235" width="50" height="8" rx="2" fill="#818cf8"/>
  <rect x="220" y="250" width="90" height="6" rx="2" fill="#64748b"/>
  <rect x="220" y="262" width="75" height="6" rx="2" fill="#64748b"/>

  <!-- Badge tag -->
  <g transform="translate(420, 290)">
    <rect width="110" height="24" rx="12" fill="#38bdf8"/>

  <rect x="90" y="235" width="50" height="8" rx="2" fill="#38bdf8"/>
  <rect x="90" y="250" width="90" height="6" rx="2" fill="#64748b"/>
  <rect x="90" y="262" width="75" height="6" rx="2" fill="#64748b"/>


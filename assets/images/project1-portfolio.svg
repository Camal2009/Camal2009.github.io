  <text x="165" y="66" fill="#94a3b8" font-family="monospace" font-size="10">https://student.github.io/portfolio</text>

  <!-- Inside window layout mock -->
  <!-- Header bar -->
  <rect x="80" y="95" width="440" height="24" rx="4" fill="#334155"/>
  <rect x="90" y="103" width="60" height="8" rx="4" fill="#38bdf8"/>
  <rect x="420" y="103" width="30" height="8" rx="4" fill="#94a3b8"/>
  <rect x="460" y="103" width="40" height="8" rx="4" fill="#818cf8"/>

  <!-- Hero section -->
  <rect x="80" y="130" width="250" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="100" y="148" width="140" height="14" rx="3" fill="url(#p1accent)"/>
  <rect x="100" y="170" width="200" height="8" rx="2" fill="#64748b"/>
  <rect x="100" y="184" width="160" height="8" rx="2" fill="#64748b"/>
  <rect x="100" y="200" width="70" height="15" rx="4" fill="#38bdf8"/>

  <!-- Avatar card mock -->
  <rect x="350" y="130" width="170" height="155" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="435" cy="180" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M420 200 C420 185 450 185 450 200" fill="#38bdf8"/>
  <circle cx="435" cy="175" r="12" fill="#38bdf8"/>
  <rect x="375" y="225" width="120" height="10" rx="3" fill="#94a3b8"/>
  <rect x="395" y="243" width="80" height="8" rx="2" fill="#64748b"/>
